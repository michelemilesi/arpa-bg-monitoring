# This is a Declarative Automation Bundle definition for arpa_bg_monitoring.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: arpa_bg_monitoring
  uuid: d2cf63e3-134c-4c87-a105-6a77aa735136

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-1b4d76cb-cd6b.cloud.databricks.com
    variables:
      catalog: arpa_bg
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-1b4d76cb-cd6b.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/michele.milesi.76@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/michele.milesi.76@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: arpa_bg
      schema: prod
    permissions:
      - user_name: michele.milesi.76@gmail.com
        level: CAN_MANAGE
