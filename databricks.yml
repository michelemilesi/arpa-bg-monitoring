# This is a Declarative Automation Bundle definition for arpa_bg_monitoring.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: arpa_bg_monitoring
  uuid: d2cf63e3-134c-4c87-a105-6a77aa735136

include:
  - resources/*.yml

# Variable declarations for Medallion architecture schemas
variables:
  catalog:
    description: The catalog to use
    default: arpa_bg
  bronze_schema:
    description: Schema for raw bronze data (SCD2)
    default: dev_bronze
  silver_schema:
    description: Schema for cleaned silver data (SCD2)
    default: dev_silver
  gold_schema:
    description: Schema for aggregated gold metrics (SCD1)
    default: dev_gold

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    mode: development
    default: true
    workspace:
      host: https://dbc-1b4d76cb-cd6b.cloud.databricks.com
    variables:
      catalog: arpa_bg
      bronze_schema: dev_bronze
      silver_schema: dev_silver
      gold_schema: dev_gold

  prod:
    mode: production
    workspace:
      host: https://dbc-1b4d76cb-cd6b.cloud.databricks.com
      root_path: /Workspace/Users/michele.milesi.76@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: arpa_bg
      bronze_schema: prod_bronze
      silver_schema: prod_silver
      gold_schema: prod_gold
    permissions:
      - user_name: michele.milesi.76@gmail.com
        level: CAN_MANAGE
